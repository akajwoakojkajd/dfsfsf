<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>BEST FRIEND</title>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* Wrapper */
.wrapper{
  position:relative;
}

/* Text chính */
.text{
  font-family: "Segoe UI", Arial, sans-serif;
  font-size:120px;
  font-weight:900;
  letter-spacing:8px;
  color:#fff;
  opacity:0;
  filter: blur(20px);
  animation: reveal 2.8s ease forwards;
}

/* Glow layer */
.text::before{
  content:"ĐỊT MẸ MÀY";
  position:absolute;
  left:0;
  top:0;
  z-index:-1;
  color:#00ffff;
  filter: blur(25px);
  opacity:0.8;
}

/* Outer glow */
.text::after{
  content:"ĐỊT MẸ MÀY";
  position:absolute;
  left:0;
  top:0;
  z-index:-2;
  color:#ff4fd8;
  filter: blur(50px);
  opacity:0.6;
}

/* Light sweep */
.light{
  position:absolute;
  top:-50%;
  left:-150%;
  width:200%;
  height:200%;
  background: linear-gradient(
    120deg,
    transparent 40%,
    rgba(255,255,255,0.25) 50%,
    transparent 60%
  );
  animation: sweep 4s ease-in-out infinite;
  pointer-events:none;
}

@keyframes reveal{
  0%{
    opacity:0;
    filter: blur(30px);
    transform: scale(0.9);
  }
  60%{
    opacity:1;
    filter: blur(2px);
  }
  100%{
    opacity:1;
    filter: blur(0);
    transform: scale(1);
  }
}

@keyframes sweep{
  0%{ transform: translateX(0); }
  50%{ transform: translateX(50%); }
  100%{ transform: translateX(100%); }
}
</style>
</head>

<body>
  <div class="wrapper">
    <div class="text">ĐỊT MẸ MÀY</div>
    <div class="light"></div>
  </div>
</body>
</html>
